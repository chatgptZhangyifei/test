<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>爱你爱你爱你爱你爱你</title>
<style>
  :root {
    --slot: clamp(34px, 9.2vw, 54px);
    --slot-gap: clamp(3px, 0.8vw, 7px);
    --ink: #2f3542;
    --muted: #7a8496;
    --accent: #5b8def;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 620px at 12% -12%, #ffffff 0%, rgba(255, 255, 255, 0) 62%),
      radial-gradient(900px 520px at 92% 112%, #e7eefc 0%, rgba(231, 238, 252, 0) 66%),
      #f5f7fb;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- 顶部信息 ---------- */
  .hud {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px clamp(12px, 3vw, 28px) 4px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
    overflow: hidden;
  }

  .brand h1 {
    margin: 0;
    min-width: 0;
    font-size: clamp(15px, 2.4vw, 20px);
    font-weight: 700;
    letter-spacing: .3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand .sub {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stats {
    margin-left: auto;
    padding: 5px 12px;
    border-radius: 999px;
    background: #fff;
    color: var(--muted);
    font-size: clamp(11px, 2.2vw, 13px);
    white-space: nowrap;
    box-shadow: 0 2px 10px rgba(70, 85, 120, .08);
  }

  .stats b {
    color: #e0604f;
    font-size: 1.15em;
  }

  .btn {
    font: inherit;
    font-size: clamp(11px, 2.2vw, 13px);
    border: 0;
    border-radius: 999px;
    padding: 7px 15px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(91, 141, 239, .28);
    transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
  }

  .btn:hover { background: #4d81e8; }
  .btn:active { transform: scale(.96); }

  .btn.primary {
    padding: 11px 28px;
    font-size: 15px;
    border-radius: 14px;
  }

  /* ---------- 棋盘区 ---------- */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 8px;
    overflow: hidden;
  }

  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
  }

  .loading.hide { display: none; }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 438px;
    height: 370px;
  }

  .board {
    position: absolute;
    top: 0;
    left: 50%;
    margin-left: -219px;
    width: 438px;
    height: 370px;
    transform-origin: top center;
  }

  .tile {
    position: absolute;
    width: var(--tile, 76px);
    height: var(--tile, 76px);
    border-radius: 14px;
    border: 4px solid var(--tile-color, #e4e9f2);
    background: #fff;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(60, 72, 100, .16), 0 1px 2px rgba(60, 72, 100, .10);
    transition: opacity .18s ease, transform .18s ease, filter .18s ease;
    will-change: transform, opacity;
  }

  .tile img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    object-fit: cover;
    pointer-events: none;
  }

  /* 角标编号：颜色 + 数字双重区分，避免相似照片混在一起 */
  .tile-no {
    position: absolute;
    right: 2px;
    bottom: 2px;
    min-width: 17px;
    height: 17px;
    padding: 0 3px;
    border-radius: 9px;
    background: var(--tile-color, #5b8def);
    color: var(--tile-ink, #fff);
    font-size: 11px;
    font-weight: 700;
    line-height: 17px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 1px 3px rgba(20, 30, 48, .35);
    pointer-events: none;
  }

  /* 可点击的牌整体提亮，层号越高越亮，体现堆叠关系 */
  .tile[data-layer="0"] { filter: brightness(1); }
  .tile[data-layer="1"] { filter: brightness(1.03); }
  .tile[data-layer="2"] { filter: brightness(1.05); }
  .tile[data-layer="3"] { filter: brightness(1.07); }
  .tile[data-layer="4"] {
    filter: brightness(1.09);
    box-shadow: 0 5px 12px rgba(60, 72, 100, .20), 0 1px 2px rgba(60, 72, 100, .12);
  }

  /* 被压住的牌轻度压暗，既好区分又不至于发黑 */
  .tile.blocked {
    opacity: .95;
    filter: brightness(.85) saturate(.8);
    cursor: not-allowed;
  }

  .tile.blocked::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: rgba(20, 30, 48, .24);
  }

  .tile.taken {
    transform: scale(.5);
    opacity: 0;
    cursor: default;
  }

  /* ---------- 槽位 ---------- */
  .footer {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    padding: 4px 10px calc(16px + env(safe-area-inset-bottom));
  }

  .slots {
    display: grid;
    grid-template-columns: repeat(7, var(--slot));
    gap: var(--slot-gap);
    padding: 8px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(70, 85, 120, .10), 0 1px 3px rgba(70, 85, 120, .06);
  }

  .slots.shake { animation: slot-shake .34s ease; }

  @keyframes slot-shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-7px); }
    32% { transform: translateX(6px); }
    50% { transform: translateX(-4px); }
    68% { transform: translateX(3px); }
    85% { transform: translateX(-1px); }
  }

  .slot {
    position: relative;
    width: var(--slot);
    height: var(--slot);
    border-radius: 11px;
    background: #eef1f7;
    box-shadow: inset 0 1px 3px rgba(70, 85, 120, .12);
    overflow: hidden;
  }

  .slot-tile {
    position: absolute;
    inset: 0;
    transition: transform .2s ease, opacity .2s ease;
  }

  .slot-tile img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 11px;
    object-fit: cover;
  }

  .slot-tile {
    border: 3px solid var(--tile-color, transparent);
    border-radius: 11px;
  }

  .slot-tile .tile-no {
    right: 0;
    bottom: 0;
    min-width: 13px;
    height: 13px;
    padding: 0 2px;
    border-radius: 7px;
    font-size: 9px;
    line-height: 13px;
  }

  .slot-tile.vanish {
    transform: scale(.15) rotate(8deg);
    opacity: 0;
  }

  /* ---------- 弹层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(36, 44, 62, .42);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .card {
    width: min(360px, 100%);
    padding: 26px 22px 22px;
    border-radius: 22px;
    background: #fff;
    text-align: center;
    box-shadow: 0 20px 50px rgba(30, 40, 60, .25);
    transform: translateY(10px) scale(.95);
    transition: transform .26s cubic-bezier(.2, .9, .3, 1.15);
  }

  .overlay.show .card { transform: none; }

  .card h2 {
    margin: 0 0 10px;
    font-size: 20px;
    font-weight: 700;
  }

  .card p {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.75;
    white-space: pre-line;
    word-break: break-word;
  }

  /* ---------- 通关告白卡片 ---------- */
  #loveCard {
    display: none;
    margin: -8px 0 20px;
    padding-top: 15px;
    border-top: 1px solid rgba(224, 96, 79, .18);
  }

  #loveCard.show { display: block; }

  #loveCard .love-lines {
    margin: 0;
    color: #a4433a;
    font-size: 13px;
    line-height: 1.85;
    white-space: pre-line;
    word-break: break-word;
  }

  /* ---------- 三消情话浮层 ---------- */
  .love-quote {
    position: fixed;
    left: 50%;
    z-index: 70;
    max-width: 86vw;
    padding: 8px 14px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .95);
    color: #b3543f;
    font-size: clamp(12px, 3.4vw, 15px);
    line-height: 1.55;
    text-align: center;
    white-space: normal;
    word-break: break-word;
    box-shadow: 0 8px 22px rgba(70, 85, 120, .16);
    transform: translate(-50%, 12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .32s ease, transform .32s ease;
    will-change: transform, opacity;
  }

  .love-quote.in {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .love-quote.egg {
    font-weight: 700;
    color: #c8392b;
    background: #fff7ef;
    box-shadow: 0 8px 26px rgba(200, 57, 43, .22);
    animation: love-heartbeat .9s ease .12s 1;
  }

  @keyframes love-heartbeat {
    0%, 100% { transform: translate(-50%, 0) scale(1); }
    35% { transform: translate(-50%, 0) scale(1.06); }
    60% { transform: translate(-50%, 0) scale(.99); }
  }

  /* ---------- 通关粒子层 ---------- */
  .love-particles {
    position: fixed;
    inset: 0;
    z-index: 80;
    overflow: hidden;
    pointer-events: none;
  }

  .love-particle {
    position: absolute;
    top: -10vh;
    will-change: transform, opacity;
    animation-name: love-fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  .love-particle.heart {
    width: auto !important;
    height: auto !important;
    line-height: 1;
  }

  @keyframes love-fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% {
      transform: translate3d(var(--drift, 0px), 118vh, 0) rotate(var(--spin, 240deg));
      opacity: .85;
    }
  }

  @media (max-width: 480px) {
    .brand .sub { display: none; }
  }

  @media (max-width: 360px) {
    .brand h1 { font-size: 14px; }
    .card { padding: 22px 16px 18px; }
  }
</style>
</head>
<body>

<header class="hud">
  <div class="brand">
    <h1>羊了个羊</h1>
    <span class="sub">点掉没被压住的牌，三个相同就消除</span>
  </div>
  <div class="stats">剩余 <b id="remain">60</b> / 60</div>
  <button class="btn" id="restart" type="button">重开</button>
</header>

<main class="stage" id="stage">
  <div class="loading hide" id="loading">正在加载素材…</div>
  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>
</main>

<footer class="footer">
  <div class="slots" id="slots"></div>
</footer>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="ovTitle">挑战成功</h2>
    <p id="ovDesc"></p>
    <div id="loveCard"></div>
    <button class="btn primary" id="ovBtn" type="button">再来一局</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 文案配置 ================= */
  // 所有对外文案集中在此，改这一处即可换主题
  var LOVE_CONFIG = {
    title: '开心消消乐',
    subtitle: '嗨皮嗨皮',
    cardLines: [
      '谢谢你陪我又走过一年。',
      '愿你每次打开这个页面，都记得有人一直在你身边。'
    ],
    quotes: [
      '遇见你，是我最好的一次洗牌。',
      '你一笑，我这边就全消了。',
      '三张能消，喜欢你的心消不掉。',
      '今天也想多陪你一局。',
      '遇见你之后，很多事我都想慢慢来，像一张一张消。',
      '洗牌是随机的，你在身边这件事，我不想随机。',
      '我这边还差一张，你笑一下，刚好。',
      '有些牌压着看不见，但有些人在旁边，心就定了。',
      '移出三张能救一局，你一句“在呢”能救我一天。',
      '牌消不消随它，你别皱眉就行。',
      '洗牌洗的是牌，不是我一看见你就乱掉的顺序。',
      '我留着最后一张，不是等通关，是等你。',
      '你的名字，是我最想留到最后的牌。'
    ],
    eggImage: '1.png',
    eggText: '嘘，这张牌下面藏着一句话：余生请多指教。'
  };

  /* ================= 常量 ================= */
  var TILE = 76;          // 单张牌尺寸
  var GAP = 4;            // 牌间距
  var PITCH = TILE + GAP; // 步距 80
  var GRID_COLS = 5;      // 每层可用格位 5 × 5
  var GRID_ROWS = 5;
  var MARGIN_X = 17;      // 给随机错位预留的边距
  var MARGIN_Y = 17;
  var JITTER = 8;         // 单张牌的随机抖动幅度
  var BOARD_W = MARGIN_X * 2 + (GRID_COLS - 1) * PITCH + TILE; // 430
  var BOARD_H = MARGIN_Y * 2 + (GRID_ROWS - 1) * PITCH + TILE; // 430
  var LAYER_COUNTS = [12, 12, 12, 12, 12]; // 五层牌数，合计 60
  // 牌面尺寸由 JS 常量统一控制，避免 CSS 与布局计算不一致
  document.documentElement.style.setProperty('--tile', TILE + 'px');
  var BLOCK_RATIO = 0.01; // 被上层覆盖超过该比例才算"被压住"
  // 每种图片的标识色，按图片顺序循环分配；前 6 色刻意拉开色相与明度，相似照片也能一眼区分
  var TYPE_COLORS = [
    '#E42313', '#0B63F6', '#12A150', '#F5B700', '#9C27B0', '#111827',
    '#00B8D4', '#FF6D00', '#C2185B'
  ];
  var SLOT_COUNT = 7;
  var TOTAL = 60;
  var MAX_TYPES = 6;  // 每局使用的图片种类数（不超过素材数量），调大则更难分辨
  var EXTS = ['png', 'jpg', 'jpeg', 'webp', 'gif'];

  /* ================= DOM ================= */
  var dom = {
    stage: document.getElementById('stage'),
    board: document.getElementById('board'),
    boardWrap: document.getElementById('boardWrap'),
    slots: document.getElementById('slots'),
    remain: document.getElementById('remain'),
    restart: document.getElementById('restart'),
    overlay: document.getElementById('overlay'),
    ovTitle: document.getElementById('ovTitle'),
    ovDesc: document.getElementById('ovDesc'),
    ovBtn: document.getElementById('ovBtn'),
    loveCard: document.getElementById('loveCard'),
    loading: document.getElementById('loading')
  };

  /* ================= 状态 ================= */
  var library = [];          // 已确认可用的图片地址
  var overlayAction = null;  // 弹层按钮当前动作

  var state = {
    gen: 0,          // 局代次，用于丢弃过期的异步回调
    tiles: [],
    slots: [],
    over: true,
    animating: false,
    startedAt: 0,
    cleared: 0,
    eggDone: false,
    meta: {}         // 图片 url -> { no, color }
  };

  /* ================= 工具 ================= */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  // 两张牌的重叠面积（像素平方）
  function overlapArea(a, b) {
    var w = Math.min(a.x + TILE, b.x + TILE) - Math.max(a.x, b.x);
    var h = Math.min(a.y + TILE, b.y + TILE) - Math.max(a.y, b.y);
    return (w > 0 && h > 0) ? w * h : 0;
  }

  /* ================= 文案与情绪反馈 ================= */
  // 非空字符串才使用配置值，否则回退到默认值
  function pickText(value, fallback) {
    return (typeof value === 'string' && value.trim()) ? value : fallback;
  }

  // 随机取一条情话；配置为空或不是数组时返回空串
  function pickQuote() {
    var list = Array.isArray(LOVE_CONFIG.quotes) ? LOVE_CONFIG.quotes : [];
    var pool = list.filter(function (q) { return typeof q === 'string' && q.trim(); });
    if (!pool.length) return '';
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function prefersReducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function applyBrand() {
    var h1 = document.querySelector('.brand h1');
    var sub = document.querySelector('.brand .sub');
    if (h1) h1.textContent = pickText(LOVE_CONFIG.title, h1.textContent);
    if (sub) sub.textContent = pickText(LOVE_CONFIG.subtitle, sub.textContent);
    document.title = pickText(LOVE_CONFIG.title, document.title);
  }

  // 告白卡片内容来自配置，逐行渲染
  function renderLoveCard() {
    if (!dom.loveCard) return;
    var list = Array.isArray(LOVE_CONFIG.cardLines) ? LOVE_CONFIG.cardLines : [];
    var lines = list.filter(function (line) { return typeof line === 'string' && line.trim(); });
    dom.loveCard.innerHTML = '';
    if (!lines.length) return;

    var box = document.createElement('div');
    box.className = 'love-lines';
    box.textContent = lines.join('\n');
    dom.loveCard.appendChild(box);
  }

  function toggleLoveCard(show) {
    if (!dom.loveCard) return;
    dom.loveCard.classList.toggle('show', !!show);
  }

  var quoteEl = null;
  var quoteTimer = 0;
  var quoteLeaveTimer = 0;

  function clearQuote() {
    if (quoteTimer) { clearTimeout(quoteTimer); quoteTimer = 0; }
    if (quoteLeaveTimer) { clearTimeout(quoteLeaveTimer); quoteLeaveTimer = 0; }
    if (quoteEl) {
      if (quoteEl.parentNode) quoteEl.parentNode.removeChild(quoteEl);
      quoteEl = null;
    }
  }

  // 槽位上方浮出一条情话；variant 为 'egg' 时使用彩蛋样式
  function showQuote(text, variant) {
    if (typeof text !== 'string' || !text.trim()) return;
    clearQuote();

    var el = document.createElement('div');
    el.className = 'love-quote' + (variant === 'egg' ? ' egg' : '');
    el.textContent = text;
    document.body.appendChild(el);

    var top = dom.slots.getBoundingClientRect().top - 132;
    el.style.top = Math.round(Math.max(8, top)) + 'px';

    quoteEl = el;
    // 先让初始样式落地，再切到终态，保证淡入上浮过渡生效
    void el.offsetWidth;
    el.classList.add('in');

    quoteTimer = setTimeout(function () {
      quoteTimer = 0;
      el.classList.remove('in');
      quoteLeaveTimer = setTimeout(function () {
        quoteLeaveTimer = 0;
        if (el.parentNode) el.parentNode.removeChild(el);
        if (quoteEl === el) quoteEl = null;
      }, 360);
    }, 1600);
  }

  // 被清除的牌是否为彩蛋图（忽略大小写与空格）
  function isEggTile(url) {
    var name = pickText(LOVE_CONFIG.eggImage, '');
    if (!name) return false;
    var file = String(url || '').split('/').pop().replace(/\s+/g, '').toLowerCase();
    return file === name.replace(/\s+/g, '').toLowerCase();
  }

  // 通关彩带/爱心粒子，结束即移除；偏好减少动效时跳过
  function celebrate() {
    if (prefersReducedMotion()) return;

    var layer = document.createElement('div');
    layer.className = 'love-particles';
    var colors = ['#e0604f', '#f0a04b', '#e8c547', '#d96b8a', '#f6b26b'];
    var frag = document.createDocumentFragment();

    for (var i = 0; i < 32; i++) {
      var p = document.createElement('span');
      var heart = i % 6 === 0;
      var color = colors[i % colors.length];
      var size = randInt(heart ? 13 : 6, heart ? 19 : 11);

      p.className = 'love-particle' + (heart ? ' heart' : '');
      if (heart) {
        p.textContent = '♥';
        p.style.color = color;
        p.style.fontSize = size + 'px';
      } else {
        p.style.width = size + 'px';
        p.style.height = randInt(13, 21) + 'px';
        p.style.background = color;
        p.style.borderRadius = '2px';
      }
      p.style.left = (Math.random() * 100).toFixed(2) + '%';
      p.style.animationDuration = randInt(1800, 2600) + 'ms';
      p.style.animationDelay = (Math.random() * 400).toFixed(0) + 'ms';
      p.style.setProperty('--drift', randInt(-70, 70) + 'px');
      p.style.setProperty('--spin', randInt(-480, 480) + 'deg');
      frag.appendChild(p);
    }

    layer.appendChild(frag);
    document.body.appendChild(layer);
    setTimeout(function () {
      if (layer.parentNode) layer.parentNode.removeChild(layer);
    }, 3200);
  }

  /* ================= 图片素材发现 ================= */
  function loadOne(url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(img.naturalWidth > 0 ? url : null); };
      img.onerror = function () { resolve(null); };
      img.src = url;
    });
  }

  function loadAll(urls) {
    var list = Array.from(new Set(urls));
    return Promise.all(list.map(loadOne)).then(function (res) {
      return res.filter(Boolean);
    });
  }

  // 清单支持 ["a.png"] 与 {"files":["a.png"]} 两种格式；file:// 下 fetch 失败则返回空
  function readManifest() {
    return fetch('images/manifest.json', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) return [];
        return res.json();
      })
      .then(function (data) {
        var arr = Array.isArray(data) ? data : (data && Array.isArray(data.files) ? data.files : []);
        return arr
          .filter(function (v) { return typeof v === 'string' && v.trim(); })
          .map(function (v) { return v.trim(); })
          .map(function (v) { return v.replace(/^\.\//, '').replace(/^\/+/, ''); })
          .map(function (v) { return /^images\//i.test(v) ? v : 'images/' + v; });
      })
      .catch(function () { return []; });
  }

  // 连续命名探测：序号从 1 起，逐个扩展名尝试，某序号全失败即停止
  function probeSequential() {
    var found = [];
    var i = 1;

    function nextNumber() {
      if (i > 200) return Promise.resolve(found);
      return nextExt(0).then(function (hit) {
        if (!hit) return found;
        found.push(hit);
        i += 1;
        return nextNumber();
      });
    }

    function nextExt(k) {
      if (k >= EXTS.length) return Promise.resolve(null);
      var url = 'images/' + i + '.' + EXTS[k];
      return loadOne(url).then(function (hit) {
        return hit || nextExt(k + 1);
      });
    }

    return nextNumber();
  }

  function collectImages() {
    return readManifest().then(function (listed) {
      if (!listed.length) return probeSequential();
      return loadAll(listed).then(function (usable) {
        return usable.length ? usable : probeSequential();
      });
    });
  }

  /* ================= 发牌 ================= */
  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  }

  // 同层牌不允许明显重叠（1px 内的贴合误差视为不重叠）
  function overlapsAny(rect, list) {
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (Math.min(rect.x + TILE, o.x + TILE) - Math.max(rect.x, o.x) > 1 &&
          Math.min(rect.y + TILE, o.y + TILE) - Math.max(rect.y, o.y) > 1) {
        return true;
      }
    }
    return false;
  }

  // 每层在 6×5 格位中随机取子集，再叠加随机错位与抖动，保证每局结构不同
  function generateLayout() {
    var cells = [];
    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        cells.push({ c: c, r: r });
      }
    }

    var offsets = [-MARGIN_X, 0, MARGIN_X];
    var layout = [];

    for (var l = 0; l < LAYER_COUNTS.length; l++) {
      var ox = offsets[randInt(0, offsets.length - 1)];
      var oy = offsets[randInt(0, offsets.length - 1)];
      var order = shuffle(cells.slice());
      var placed = [];

      for (var k = 0; k < LAYER_COUNTS[l]; k++) {
        var cell = order[k];
        var baseX = MARGIN_X + ox + cell.c * PITCH;
        var baseY = MARGIN_Y + oy + cell.r * PITCH;
        var pos = { x: baseX, y: baseY };

        // 多次尝试抖动位置，避开同层明显重叠；都失败则退回格位原位
        for (var t = 0; t < 12; t++) {
          var cand = {
            x: clamp(baseX + randInt(-JITTER, JITTER), 0, BOARD_W - TILE),
            y: clamp(baseY + randInt(-JITTER, JITTER), 0, BOARD_H - TILE)
          };
          if (!overlapsAny(cand, placed)) { pos = cand; break; }
        }

        placed.push(pos);
        layout.push({ layer: l, x: pos.x, y: pos.y });
      }
    }

    return layout;
  }

  function pickTypes(pool) {
    var uniq = Array.from(new Set(pool));
    if (!uniq.length) return [];
    // 固定取前 MAX_TYPES 种，颜色与编号跨局保持一致；想换种类就调整图片文件名顺序
    return uniq.slice(0, Math.min(MAX_TYPES, uniq.length));
  }

  // 20 组三元组按轮转分配给图片种类，保证每种数量都是 3 的倍数且尽量平均
  function buildTiles(types) {
    var urls = [];
    for (var g = 0; g < 20; g++) {
      var url = types[g % types.length];
      urls.push(url, url, url);
    }
    shuffle(urls);

    var positions = generateLayout();
    var tiles = [];
    for (var i = 0; i < positions.length; i++) {
      var p = positions[i];
      tiles.push({
        id: i + 1,
        url: urls[i],
        layer: p.layer,
        x: p.x,
        y: p.y,
        blocked: false,
        removed: false,
        el: null
      });
    }
    return tiles;
  }

  // 角标文字颜色随底色明暗切换，保证黄、黑这类极端底色上都能看清数字
  function inkFor(hex) {
    var r = parseInt(hex.substr(1, 2), 16);
    var g = parseInt(hex.substr(3, 2), 16);
    var b = parseInt(hex.substr(5, 2), 16);
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.65 ? '#1a1a1a' : '#ffffff';
  }

  // 为每种图片分配编号与标识色，整局保持一致
  function buildTypeMeta(types) {
    var map = {};
    for (var i = 0; i < types.length; i++) {
      map[types[i]] = {
        no: i + 1,
        color: TYPE_COLORS[i % TYPE_COLORS.length]
      };
    }
    return map;
  }

  function renderTiles(tiles) {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      var node = document.createElement('div');
      node.className = 'tile';
      node.dataset.id = String(t.id);
      node.dataset.layer = String(t.layer);
      node.style.left = t.x + 'px';
      node.style.top = t.y + 'px';
      node.style.zIndex = String(10 + t.layer * 100 + i);

      var meta = state.meta[t.url];
      if (meta) {
        node.style.setProperty('--tile-color', meta.color);
        node.style.setProperty('--tile-ink', inkFor(meta.color));
      }

      var img = document.createElement('img');
      img.src = t.url;
      img.alt = '';
      img.draggable = false;
      node.appendChild(img);

      if (meta) {
        var no = document.createElement('span');
        no.className = 'tile-no';
        no.textContent = String(meta.no);
        no.setAttribute('aria-hidden', 'true');
        node.appendChild(no);
      }

      t.el = node;
      frag.appendChild(node);
    }
    dom.board.innerHTML = '';
    dom.board.appendChild(frag);
  }

  /* ================= 遮挡判定 ================= */
  function refreshBlocked() {
    var live = state.tiles.filter(function (t) { return !t.removed; });
    for (var i = 0; i < live.length; i++) {
      var t = live[i];
      // 只有被更高层的牌覆盖到一定面积才算被压住，避免 1~2px 细边造成"看着没压却点不动"
      var covered = 0;
      for (var j = 0; j < live.length; j++) {
        var other = live[j];
        if (other.layer <= t.layer) continue;
        covered += overlapArea(t, other);
      }
      var blocked = covered / (TILE * TILE) >= BLOCK_RATIO;
      t.blocked = blocked;
      if (t.el) t.el.classList.toggle('blocked', blocked);
    }
  }

  /* ================= 槽位渲染 ================= */
  function renderSlots(animate) {
    var prev = new Map();
    if (animate) {
      var olds = dom.slots.querySelectorAll('.slot-tile');
      for (var k = 0; k < olds.length; k++) {
        prev.set(olds[k].dataset.id, olds[k].getBoundingClientRect().left);
      }
    }

    dom.slots.innerHTML = '';
    for (var i = 0; i < SLOT_COUNT; i++) {
      var cell = document.createElement('div');
      cell.className = 'slot';
      var item = state.slots[i];
      if (item) {
        var box = document.createElement('div');
        box.className = 'slot-tile';
        box.dataset.id = String(item.id);
        var slotMeta = state.meta[item.url];
        if (slotMeta) {
          box.style.setProperty('--tile-color', slotMeta.color);
          box.style.setProperty('--tile-ink', inkFor(slotMeta.color));
        }
        var img = document.createElement('img');
        img.src = item.url;
        img.alt = '';
        img.draggable = false;
        box.appendChild(img);
        if (slotMeta) {
          var slotNo = document.createElement('span');
          slotNo.className = 'tile-no';
          slotNo.textContent = String(slotMeta.no);
          slotNo.setAttribute('aria-hidden', 'true');
          box.appendChild(slotNo);
        }
        cell.appendChild(box);
      }
      dom.slots.appendChild(cell);
    }

    if (!animate) return;

    // 新入槽缩放弹出，其余牌横向位移补位
    var now = dom.slots.querySelectorAll('.slot-tile');
    for (var n = 0; n < now.length; n++) {
      var el = now[n];
      var before = prev.get(el.dataset.id);
      if (before === undefined) {
        el.animate(
          [{ transform: 'scale(.55)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
          { duration: 190, easing: 'cubic-bezier(.2,.9,.3,1.2)' }
        );
      } else {
        var dx = before - el.getBoundingClientRect().left;
        if (Math.abs(dx) > 0.5) {
          el.animate(
            [{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(0)' }],
            { duration: 220, easing: 'ease-out' }
          );
        }
      }
    }
  }

  function shakeSlots() {
    dom.slots.classList.remove('shake');
    void dom.slots.offsetWidth;
    dom.slots.classList.add('shake');
    setTimeout(function () { dom.slots.classList.remove('shake'); }, 360);
  }

  /* ================= 游戏流程 ================= */
  function startGame() {
    state.gen += 1;
    state.over = false;
    state.animating = false;
    state.slots = [];
    state.cleared = 0;
    state.eggDone = false;
    state.startedAt = performance.now();

    hideOverlay();
    toggleLoveCard(false);
    clearQuote();
    dom.loading.classList.add('hide');

    var types = pickTypes(library);
    if (!types.length) {
      showNoImage();
      return;
    }
    state.meta = buildTypeMeta(types);

    state.tiles = buildTiles(types);
    renderTiles(state.tiles);
    refreshBlocked();
    renderSlots(false);
    updateHud();
    requestFit();
  }

  function updateHud() {
    var remain = 0;
    for (var i = 0; i < state.tiles.length; i++) {
      if (!state.tiles[i].removed) remain++;
    }
    dom.remain.textContent = String(remain);
  }

  function onTileClick(tile) {
    if (state.over || state.animating) return;
    if (tile.removed || tile.blocked) return;

    if (state.slots.length >= SLOT_COUNT) {
      shakeSlots();
      return;
    }

    // 1. 从棋盘移除
    tile.removed = true;
    if (tile.el) {
      var node = tile.el;
      node.classList.remove('blocked');
      node.classList.add('taken');
      tile.el = null;
      setTimeout(function () {
        if (node.isConnected) node.remove();
      }, 220);
    }

    // 2. 插入槽位：同图紧挨放在最后一张同类之后
    var pos = state.slots.length;
    for (var i = state.slots.length - 1; i >= 0; i--) {
      if (state.slots[i].url === tile.url) { pos = i + 1; break; }
    }
    state.slots.splice(pos, 0, { id: tile.id, url: tile.url });

    refreshBlocked();
    updateHud();
    renderSlots(true);

    // 3. 检查三消 -> 胜利 -> 失败
    settle();
  }

  function findTriple() {
    var counts = {};
    for (var i = 0; i < state.slots.length; i++) {
      var u = state.slots[i].url;
      counts[u] = (counts[u] || 0) + 1;
      if (counts[u] >= 3) return u;
    }
    return null;
  }

  function settle() {
    var url = findTriple();
    if (!url) { afterSettle(); return; }

    state.animating = true;
    var gen = state.gen;

    // 给前三张同类牌加消失动画
    var nodes = dom.slots.querySelectorAll('.slot-tile');
    var marked = 0;
    for (var i = 0; i < state.slots.length && marked < 3; i++) {
      if (state.slots[i].url === url) {
        nodes[i].classList.add('vanish');
        marked++;
      }
    }

    setTimeout(function () {
      if (gen !== state.gen) return;

      var idxs = [];
      for (var k = 0; k < state.slots.length && idxs.length < 3; k++) {
        if (state.slots[k].url === url) idxs.push(k);
      }
      for (var m = idxs.length - 1; m >= 0; m--) {
        state.slots.splice(idxs[m], 1);
      }

      state.cleared += 1;
      state.animating = false;
      renderSlots(true);

      // 三消成功后冒一条情话；彩蛋图优先，且每局只触发一次
      if (!state.eggDone && isEggTile(url)) {
        state.eggDone = true;
        showQuote(pickText(LOVE_CONFIG.eggText, ''), 'egg');
      } else {
        showQuote(pickQuote());
      }

      afterSettle();
    }, 210);
  }

  function afterSettle() {
    updateHud();

    var boardEmpty = state.tiles.every(function (t) { return t.removed; });
    if (boardEmpty && state.slots.length === 0) { finish(true); return; }
    if (state.slots.length >= SLOT_COUNT) { finish(false); return; }
  }

  function finish(win) {
    state.over = true;
    var seconds = Math.max(1, Math.round((performance.now() - state.startedAt) / 1000));

    if (win) {
      showOverlay('挑战成功', '用时 ' + seconds + ' 秒，全部消除完成。\n纪念日快乐', '再来一局', startGame);
      toggleLoveCard(true);
      celebrate();
    } else {
      toggleLoveCard(false);
      showOverlay(
        '槽位已满',
        '没有可以立即消除的三张同图了。\n本局已消除 ' + state.cleared + ' 组。',
        '再来一局',
        startGame
      );
    }
  }

  /* ================= 弹层 ================= */
  function showOverlay(title, desc, btnText, action) {
    dom.ovTitle.textContent = title;
    dom.ovDesc.textContent = desc;
    dom.ovBtn.textContent = btnText;
    overlayAction = action;
    dom.overlay.classList.add('show');
  }

  function hideOverlay() {
    dom.overlay.classList.remove('show');
    overlayAction = null;
  }

  function showNoImage() {
    state.over = true;
    showOverlay(
      '还没有可用的图片',
      '把牌面图片放到 images/ 目录即可开始。\n'
        + '方式一：按 1.png、2.png … 连续编号（支持 png / jpg / jpeg / webp / gif）\n'
        + '方式二：任意命名后，运行 scripts/generate-manifest.ps1 生成 images/manifest.json',
      '重新加载',
      boot
    );
  }

  /* ================= 自适应缩放 ================= */
  var rafId = 0;

  function fitBoard() {
    var availW = dom.stage.clientWidth - 12;
    var availH = dom.stage.clientHeight - 10;
    if (availW <= 0 || availH <= 0) return;

    var scale = Math.min(availW / BOARD_W, availH / BOARD_H, 1.6);
    scale = Math.max(0.35, scale);

    dom.board.style.transform = 'scale(' + scale + ')';
    dom.boardWrap.style.height = Math.round(BOARD_H * scale) + 'px';
  }

  function requestFit() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function () {
      rafId = 0;
      fitBoard();
    });
  }

  /* ================= 启动 ================= */
  function boot() {
    var gen = ++state.gen;
    state.over = true;
    state.animating = false;
    state.tiles = [];
    state.slots = [];
    state.eggDone = false;

    applyBrand();
    renderLoveCard();
    toggleLoveCard(false);
    clearQuote();

    dom.board.innerHTML = '';
    dom.remain.textContent = String(TOTAL);
    renderSlots(false);
    hideOverlay();
    dom.loading.classList.remove('hide');

    collectImages().then(function (urls) {
      if (gen !== state.gen) return;
      dom.loading.classList.add('hide');
      library = urls;
      if (!library.length) { showNoImage(); return; }
      startGame();
    });
  }

  // 事件绑定只做一次，重开不会叠加监听
  dom.board.addEventListener('click', function (e) {
    var node = e.target.closest ? e.target.closest('.tile') : null;
    if (!node) return;
    var id = Number(node.dataset.id);
    var tile = null;
    for (var i = 0; i < state.tiles.length; i++) {
      if (state.tiles[i].id === id) { tile = state.tiles[i]; break; }
    }
    if (tile) onTileClick(tile);
  });

  dom.restart.addEventListener('click', function () {
    if (!library.length) { boot(); return; }
    startGame();
  });

  dom.ovBtn.addEventListener('click', function () {
    var action = overlayAction;
    hideOverlay();
    if (action) action();
  });

  window.addEventListener('resize', requestFit);
  window.addEventListener('orientationchange', requestFit);
  window.addEventListener('load', requestFit);

  boot();
})();
</script>
</body>
</html>
